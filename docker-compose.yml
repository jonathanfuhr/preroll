services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: preroll
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-preroll}
      POSTGRES_DB: preroll
    volumes:
      # Ab Postgres 18 gehört der Mount an /var/lib/postgresql, nicht mehr an
      # /var/lib/postgresql/data: Das Image legt die Daten dort in einem
      # Unterordner je Hauptversion ab, damit pg_upgrade --link später ohne
      # Mount-Grenzen funktioniert. Am alten Pfad verweigert es den Start.
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U preroll -d preroll']
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    restart: unless-stopped
    # Das Bridge-Netz hat keine IPv6-Route, Dockers Resolver liefert für
    # Microsoft- und Google-Hosts aber ausschließlich AAAA-Einträge. Node läuft
    # damit in ENETUNREACH, und jeder ausgehende Aufruf scheitert — Entra-ID-
    # Anmeldung, Graph-Mailversand, Klappe. Abgeschaltetes IPv6 bringt den
    # Container dazu, die vorhandenen IPv4-Adressen zu benutzen.
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Ohne diese Zeile läuft der Container in UTC — und damit rechnet der
      # Server in einer anderen „Ortszeit" als der Browser. Genau daran hing,
      # dass Posting-Uhrzeiten beim Speichern um zwei Stunden sprangen. Alles,
      # was Ortszeit liest (ZIP-Dateinamen, Kalenderwoche, Monatsraster),
      # stimmt damit auf einen Schlag.
      TZ: ${TZ:-Europe/Berlin}
      DATABASE_URL: postgresql://preroll:${POSTGRES_PASSWORD:-preroll}@postgres:5432/preroll?schema=public
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET fehlt}
      APP_URL: ${APP_URL:-http://localhost:3000}
      UPLOAD_DIR: /app/data/uploads
    volumes:
      # Hochgeladene Medien liegen auf dem Host, nicht im Container — so sind
      # sie ohne Docker erreichbar und überleben jedes Neubauen des Images.
      # MEDIEN_PFAD zeigt auf ein Verzeichnis auf dem Mac bzw. Server.
      - ${MEDIEN_PFAD:-./data}:/app/data
    ports:
      # Nur auf die Loopback-Adresse veröffentlichen: Nach außen geht es über
      # den Cloudflare-Tunnel, der nativ auf demselben Mac läuft. So ist die
      # App aus dem LAN nicht erreichbar.
      #
      # 4400, weil auf dem Mac Mini bereits Klappe (3000) und Mappe (4300)
      # liegen.
      - '${BIND_ADDR:-127.0.0.1}:${PORT:-4400}:3000'

volumes:
  postgres:
