services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: preroll
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-preroll}
      POSTGRES_DB: preroll
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U preroll -d preroll']
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://preroll:${POSTGRES_PASSWORD:-preroll}@postgres:5432/preroll?schema=public
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET fehlt}
      APP_URL: ${APP_URL:-http://localhost:3000}
      UPLOAD_DIR: /app/data/uploads
    volumes:
      # Hochgeladene Medien liegen auf dem Host, nicht im Container — so sind
      # sie ohne Docker erreichbar und überleben jedes Neubauen des Images.
      # MEDIEN_PFAD zeigt auf ein Verzeichnis auf dem Mac bzw. Server.
      - ${MEDIEN_PFAD:-./data}:/app/data
    ports:
      # Nur auf die Loopback-Adresse veröffentlichen: Nach außen geht es über
      # den Cloudflare-Tunnel, der nativ auf demselben Mac läuft. So ist die
      # App aus dem LAN nicht erreichbar.
      #
      # 4400, weil auf dem Mac Mini bereits Klappe (3000) und Mappe (4300)
      # liegen.
      - '${BIND_ADDR:-127.0.0.1}:${PORT:-4400}:3000'

volumes:
  postgres:
